// Applied only when -Ppolyglot.android=true. Groovy keeps this file dynamically typed so the
// Kotlin build scripts compile even when the Android Gradle Plugin is absent.
// The module applies com.android.kotlin.multiplatform.library (AGP 9); its Android target is set up here.
// JvmTarget is loaded from the Kotlin plugin, which this script's own class loader cannot see.
def jvm17 = Enum.valueOf(kotlin.class.classLoader.loadClass('org.jetbrains.kotlin.gradle.dsl.JvmTarget'), 'JVM_17')

kotlin {
    android {
        namespace = project.ext.androidNamespace
        compileSdk = 37
        minSdk = 26
        compilerOptions { jvmTarget = jvm17 }
        // Compose resources (fonts, drawables) are packaged as Android resources.
        if (project.ext.has('androidResourcesEnabled')) androidResources { enable = true }
    }
}
